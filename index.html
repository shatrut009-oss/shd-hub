<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ШД Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header class="top-header">
    <div class="user-info">
      <div class="avatar" id="userAvatar"></div>
      <div class="user-text">
        <div class="username" id="userName">Гость</div>
        <div class="user-tag" id="userTag">@guest</div>
      </div>
    </div>
  </header>

  <main>
    <!-- ЭДИТЫ -->
    <section class="screen active" id="screen-edits"></section>
    
    <!-- НОВОСТИ -->
    <section class="screen" id="screen-news"></section>

    <!-- ПРОФИЛЬ -->
    <section class="screen" id="screen-profile">
      <div style="text-align:center; margin-top:50px;">
        <div class="detail-avatar" id="profAvatar" style="margin-bottom:15px;"></div>
        <h2 id="profName" style="font-family:Oswald; font-size:28px; color:#fff;">Игрок</h2>
        <p style="color:#8b95a5; margin-bottom:20px;">Добро пожаловать в ШД Hub</p>
        <button class="btn-buy-lot" style="width:80%; margin:0 auto;" onclick="alert('Оплата Stars скоро появится!')">Пополнить баланс ⭐</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-target="screen-edits">
      <div class="nav-icon" style="background:#ff1e3c;">▶️</div><span>Эдиты</span>
    </button>
    <button class="nav-btn" data-target="screen-news">
      <div class="nav-icon">📰</div><span>Новости</span>
    </button>
    <button class="nav-btn" data-target="screen-profile">
      <div class="nav-icon">👤</div><span>Профиль</span>
    </button>
  </nav>
</div>

<script src="app.js"></script>
</body>
</html>
