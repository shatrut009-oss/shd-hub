<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ШД Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" role="button" aria-label="Открыть ШД Hub">
  <svg viewBox="900 310 770 815" aria-hidden="true">
    <g class="half l" fill="#fff" fill-rule="evenodd">
      <path d="M912 322C945 372 966 420 968 455L970 670L972 975C970 1040 948 1085 917 1115L1258 970C1272 962 1275 940 1275 910L1275 530C1276 490 1260 462 1230 450Z M1081 510L1082 928L1158 896L1159 542Z"/>
    </g>
    <g class="half r" fill="#fff" fill-rule="evenodd">
      <path d="M1660 322C1627 372 1606 420 1604 455L1602 670L1600 975C1602 1040 1624 1085 1659 1115L1318 970C1304 962 1301 940 1301 910L1301 530C1300 490 1316 462 1346 450Z M1495 510L1493 928L1417 896L1416 542Z"/>
    </g>
  </svg>
  <div class="hint">НАЖМИ, ЧТОБЫ ВОЙТИ</div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <span style="font-family:Oswald; font-size:20px; font-weight:700;">ШД <span style="color:var(--acc)">HUB</span></span>
    </div>
    <div class="user-pill">
      <span id="whoLabel">Гость</span>
      <div class="avatar-mini" id="headerAvatar">?</div>
    </div>
  </header>

  <main>
    <!-- 1. ЭДИТЫ -->
    <section class="screen active" data-s="edits">
      <button class="sound-btn" id="soundBtn">🔇 Звук выкл</button>
      <div class="feed" id="feed"></div>
    </section>

    <!-- 2. НОВОСТИ -->
    <section class="screen" data-s="news">
      <h2 class="page-title">Новости</h2>
      <div id="newsList"></div>
    </section>

    <!-- 3. ЗАКУЛИСЬЕ -->
    <section class="screen" data-s="backstage">
      <h2 class="page-title">Закулисье</h2>
      <p class="page-sub">Откроется при 50 лайках</p>
      <div id="backList"></div>
    </section>

    <!-- 4. ПРОФИЛЬ -->
    <section class="screen" data-s="profile" style="padding:0; background:#07070a;">
      <div class="top-balance">
        <div class="balance-item">
          <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" class="ico-img">
          <b>0</b> <span>Stars</span>
        </div>
        <div class="balance-item">
          <img src="https://cdn-icons-png.flaticon.com/512/616/616494.png" class="ico-img" style="filter: invert(48%) sepia(79%) saturate(2476%) hue-rotate(86deg) brightness(118%) contrast(119%);">
          <b>0</b> <span>Монет</span>
        </div>
      </div>

      <div class="profile-main">
        <div class="hero">
          <div class="avatar-wrapper">
            <div class="avatar" id="avatar">?</div>
          </div>
          <div class="nick" id="profName">Гость</div>
          <div class="handle" id="profHandle">@guest</div>
        </div>

        <div class="profile-grid">
          <div class="grid-item" style="background: linear-gradient(135deg, #1e1e24, #0c0c0f);">
            <div class="grid-ico" style="background: rgba(157,77,255,0.2);">👤</div>
            <span>Мой профиль</span>
          </div>
          <div class="grid-item" style="background: linear-gradient(135deg, #0f1a2e, #0c0c0f);">
            <div class="grid-ico" style="background: rgba(30,144,255,0.2);">🕒</div>
            <span>История</span>
          </div>
          <div class="grid-item" style="background: linear-gradient(135deg, #2e1e0a, #0c0c0f);">
            <div class="grid-ico" style="background: rgba(255,165,0,0.2);">📦</div>
            <span>Мои заказы</span>
          </div>
          <div class="grid-item" style="background: linear-gradient(135deg, #1e0f2e, #0c0c0f);">
            <div class="grid-ico" style="background: rgba(157,77,255,0.2);">🖼️</div>
            <span>Мой НФТ</span>
          </div>
          <div class="grid-item" style="background: linear-gradient(135deg, #0f2e1e, #0c0c0f);">
            <div class="grid-ico" style="background: rgba(0,255,127,0.2);">🛡️</div>
            <span>Мой клан</span>
          </div>
          <div class="grid-item" style="background: linear-gradient(135deg, #2e0f0f, #0c0c0f);">
            <div class="grid-ico" style="background: rgba(255,30,60,0.2);">⚡</div>
            <span>Заработать</span>
          </div>
        </div>

        <h2 class="section-title">Чем займёмся?</h2>
        <div class="promo-cards">
          <div class="promo-card" style="background: linear-gradient(45deg, #3a1c00, #000);">
            <h3>Кейсы</h3>
            <p>Призы сразу на баланс</p>
          </div>
          <div class="promo-card" style="background: linear-gradient(45deg, #2a003a, #000);">
            <h3>Кружок актёра</h3>
            <p>Видео-привет лично тебе</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav id="nav">
    <button class="on" data-t="edits">Эдиты</button>
    <button data-t="news">Новости</button>
    <button data-t="backstage">Закулисье</button>
    <button data-t="profile">Профиль</button>
  </nav>
</div>

<div id="mediaModal" class="media-modal">
  <span class="close-modal" id="closeMedia">✕</span>
  <div id="mediaContent"></div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
